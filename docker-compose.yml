version: '3.8'

name: workalaya

services:
  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: workalaya-postgres
    environment:
      POSTGRES_USER: workalaya
      POSTGRES_PASSWORD: workalaya123
      POSTGRES_DB: workalaya
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - workalaya-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workalaya']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workalaya-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - workalaya-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: workalaya-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: workalaya
      MONGO_INITDB_ROOT_PASSWORD: workalaya123
      MONGO_INITDB_DATABASE: workalaya_audit
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - workalaya-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Object Storage
  minio:
    image: minio/minio:latest
    container_name: workalaya-minio
    environment:
      MINIO_ROOT_USER: workalaya
      MINIO_ROOT_PASSWORD: workalaya123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - workalaya-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # Vector Database for Search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: workalaya-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - workalaya-network
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6333/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: workalaya-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - workalaya-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: workalaya-kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - workalaya-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 5s
      retries: 5

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: workalaya-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - workalaya-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    container_name: workalaya-grafana
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: workalaya123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - workalaya-network
    depends_on:
      - prometheus

  # Application Services (Development)
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: workalaya-api-gateway
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      POSTGRES_URL: postgresql://workalaya:workalaya123@postgres:5432/workalaya
      REDIS_URL: redis://redis:6379
    networks:
      - workalaya-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    profiles:
      - dev

  ai-gateway:
    build:
      context: .
      dockerfile: apps/ai-service/gateway/Dockerfile
    container_name: workalaya-ai-gateway
    ports:
      - '8000:8000'
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      POSTGRES_URL: postgresql://workalaya:workalaya123@postgres:5432/workalaya
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    networks:
      - workalaya-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./apps/ai-service/gateway:/app
    profiles:
      - dev

  ticketing-web:
    build:
      context: .
      dockerfile: apps/ticketing/web/Dockerfile
    container_name: workalaya-ticketing-web
    ports:
      - '4200:4200'
    environment:
      NODE_ENV: development
      API_URL: http://api-gateway:3000
    networks:
      - workalaya-network
    depends_on:
      - api-gateway
    volumes:
      - ./apps/ticketing/web:/app
      - /app/node_modules
    profiles:
      - dev

networks:
  workalaya-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  qdrant_data:
  kafka_data:
  prometheus_data:
  grafana_data:
